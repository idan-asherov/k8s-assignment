apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortune-api
  labels:
    app: fortune-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fortune-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: fortune-api
    spec:
      containers:
        - name: fortune-api
          image: fortune-api:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "v1"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: 200m
