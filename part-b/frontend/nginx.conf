server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # הבקשות ל-/api/ עוברות ל-Service של ה-API בתוך הקלאסטר
    location /api/ {
        proxy_pass http://fortune-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
}
