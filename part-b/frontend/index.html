<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מפעל עוגיות המזל</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;background:#fff7e6;color:#3b2a14;margin:0;display:flex;
       min-height:100vh;align-items:center;justify-content:center;text-align:center}
  .card{background:#fff;border-radius:16px;padding:32px 28px;max-width:480px;width:90%;
        box-shadow:0 6px 24px rgba(0,0,0,.12)}
  h1{margin:0 0 6px}
  button{font-size:18px;padding:12px 28px;border:0;border-radius:10px;background:#e08a1e;color:#fff;cursor:pointer;margin:16px 0}
  button:hover{background:#c97712}
  #fortune{font-size:20px;min-height:60px;margin:10px 0}
  #meta{font-size:14px;color:#7a6548;direction:ltr}
  #history{margin-top:18px;text-align:right;font-size:13px;color:#7a6548}
</style>
</head>
<body>
<div class="card">
  <h1>🥠 מפעל עוגיות המזל</h1>
  <p>כל עוגייה נאפית ב-Pod אחר. לחץ וראה מי אפה אותה.</p>
  <button id="btn">פתחו עוגייה</button>
  <div id="fortune"></div>
  <div id="meta"></div>
  <div id="history"></div>
</div>
<script>
const history = [];
document.getElementById("btn").addEventListener("click", async () => {
  const f = document.getElementById("fortune");
  const m = document.getElementById("meta");
  try {
    const r = await fetch("/api/fortune");
    const d = await r.json();
    f.textContent = d.fortune;
    m.textContent = `pod: ${d.pod} | version: ${d.version} | baked by this pod: ${d.baked}`;
    history.unshift(`${d.pod} (${d.version})`);
    document.getElementById("history").textContent = "אחרונות: " + history.slice(0, 6).join("  ·  ");
  } catch (e) {
    f.textContent = "משהו השתבש, נסה שוב.";
    m.textContent = String(e);
  }
});
</script>
</body>
</html>
